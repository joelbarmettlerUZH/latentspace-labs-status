owner: joelbarmettlerUZH
repo: latentspace-labs-status

# Hourly checks, off the :00 minute: GitHub drops or delays top-of-the-hour crons.
workflowSchedule:
  uptime: "7 * * * *"

# Repository secrets Upptime may read. This is the complete allowlist.
secrets:
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID
  - UNBUBBLE_BASIC_AUTH # base64 of "user:password" for the Caddy basic_auth

# GitHub also notifies the assignee when an incident issue opens.
assignees:
  - joelbarmettlerUZH

sites:
  # --- Slidev MCP ---
  - name: Slidev MCP Website
    slug: slidev-mcp-web
    url: https://slidev-mcp.org
  - name: Slidev MCP Server
    slug: slidev-mcp-server
    # Checks Postgres and the slide builder; returns 503 when degraded.
    url: https://mcp.slidev-mcp.org/health

  # --- Vue MCP ---
  - name: Vue MCP Website
    slug: vue-mcp-web
    url: https://vue-mcp.org
  - name: Vue MCP Server
    slug: vue-mcp-server
    # Needs GET /health on the server; reports down until that is deployed.
    url: https://mcp.vue-mcp.org/health

  # --- Souverana ---
  - name: Souverana Website
    slug: souverana-web
    url: https://souverana.ch
  - name: Souverana API
    slug: souverana-api
    # Needs GET /api/health on lead-api; reports down until that is deployed.
    url: https://souverana.ch/api/health
  - name: Souverana Analytics
    slug: souverana-analytics
    # Self-hosted Umami; the same heartbeat its Docker healthcheck uses.
    url: https://stats.souverana.ch/api/heartbeat

  # --- Plain websites ---
  - name: Latentspace Labs Website
    slug: latentspace-labs-web
    url: https://latentspace-labs.ch
  - name: Joel Barmettler Website
    slug: joelbarmettler-web
    url: https://joelbarmettler.xyz

  # --- Unbubble (private alpha behind Caddy basic auth) ---
  - name: Unbubble Website
    slug: unbubble-web
    url: https://unbubble.ch
    # 401 means Caddy is up and challenging; that is healthy for the frontend.
    expectedStatusCodes:
      - 200
      - 401
  - name: Unbubble API
    slug: unbubble-api
    # /ready is the readiness probe: database plus "can serve current data".
    # It is stricter than /health, so stale data pages you too.
    url: https://unbubble.ch/api/ready
    headers:
      - "Authorization: Basic $UNBUBBLE_BASIC_AUTH"
  - name: Unbubble Analytics
    slug: unbubble-analytics
    # Self-hosted Umami. Its collector is public, so no auth header is needed.
    url: https://analytics.unbubble.ch/api/heartbeat

status-website:
  cname: status.latentspace-labs.ch
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Latentspace Labs Status
  introTitle: "**Latentspace Labs** service status"
  introMessage: Live health of our websites and MCP servers, checked hourly.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
